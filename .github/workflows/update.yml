name: update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # A bulletin PDF uploaded by hand (raw/YYYY-MM.pdf) rebuilds the dataset right away.
  push:
    branches: [main]
    paths: ['raw/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (fetch fallback)
        run: npx playwright-core install --with-deps chromium

      # Fetches the index, then only months missing from raw/.
      # Exit code 2 = some month was blocked on every method (live + Wayback).
      - name: Fetch missing bulletins
        id: fetch
        continue-on-error: true
        run: npm run fetch

      - name: Track consecutive blocked runs
        id: track
        run: |
          n=$(cat state/fetch_failures 2>/dev/null || echo 0)
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then n=$((n+1)); else n=0; fi
          echo "$n" > state/fetch_failures
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Parse and rebuild outputs
        run: npm run build

      - name: Test
        run: npm test

      # Mondays (or manual runs): which USCIS chart applies this month.
      # Processing-time snapshots are not collected (egov.uscis.gov is behind a Cloudflare challenge).
      - name: USCIS filing chart (weekly)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then npm run uscis; fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw data state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update visa bulletin data $(date -u +%F)"
          git push

      - name: Open an issue if a due bulletin could not be fetched 3 runs in a row
        if: steps.track.outputs.count >= 3
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.track.outputs.count }}
        run: |
          title="A visa bulletin is overdue: fetching is blocked"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json title --jq ".[] | select(.title==\"$title\") | .title")
          if [ -z "$existing" ]; then
            {
              echo "travel.state.gov blocked every automated route (plain fetch, Playwright, Wayback Machine, PDF) for $COUNT runs in a row."
              echo
              echo "To add it by hand: open the PDF link below in a normal browser, then upload the file to this repo under the listed name (Add file > Upload files, works from a phone). The upload rebuilds the dataset within minutes; close this issue after."
              echo
              cat missing.md 2>/dev/null
              echo
              echo "Latest run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > issue.md
            gh issue create --title "$title" --body-file issue.md
          fi
